# Site settings
title: "TL;DR"
tagline: "Eugene's Tech Lab"
description: >-
  Writeups, privacy research and security projects by Eugene TL —
  offensive security student and pentester.
url: "https://eugenetl.com"
email: contact@eugenetl.com
lang: en
github_username: AfterEugenes
htb_profile: "https://app.hackthebox.com/users/2162889"

# Content collections (generated from the Obsidian vaults by tools/sync.py)
collections:
  HTB:
    output: true
  CTF:
    output: true
  privacy_docs:
    output: true

defaults:
  - scope:
      path: ""
      type: "HTB"
    values:
      layout: "writeup"
  - scope:
      path: ""
      type: "CTF"
    values:
      layout: "writeup"
  - scope:
      path: ""
      type: "privacy_docs"
    values:
      layout: "privacy-doc"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

plugins:
  - jekyll-seo-tag

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - tools
  - publish.sh
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - tmp
