<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} — {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <style>
    :root {
      --sidebar-width: 280px;
      --content-width: 900px;

      --background: #ffffff;
      --sidebar-background: #f7f7f8;
      --border: #e5e5e5;
      --text: #222222;
      --muted: #666666;
      --link: #2563eb;
      --active-background: #e8eefc;
      --active-text: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.6;
    }

    .docs-layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    .docs-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;

      padding: 2rem 1rem;

      background: var(--sidebar-background);
      border-right: 1px solid var(--border);
    }

    .docs-sidebar-title {
      display: block;
      margin: 0 0 1.5rem;
      padding: 0 0.75rem;

      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
    }

    .docs-navigation {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .docs-navigation a {
      display: block;

      padding: 0.55rem 0.75rem;

      color: var(--text);
      border-radius: 0.4rem;

      font-size: 0.95rem;
      text-decoration: none;

      transition:
        background-color 0.15s ease,
        color 0.15s ease;
    }

    .docs-navigation a:hover {
      background: #eeeeef;
    }

    .docs-navigation a.active {
      color: var(--active-text);
      background: var(--active-background);
      font-weight: 600;
    }

    .docs-main {
      width: 100%;
      max-width: calc(var(--content-width) + 4rem);

      padding: 3rem 2rem 5rem;
      margin: 0 auto;
    }

    .docs-content {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .docs-content h1,
    .docs-content h2,
    .docs-content h3,
    .docs-content h4,
    .docs-content h5,
    .docs-content h6 {
      line-height: 1.25;
      scroll-margin-top: 2rem;
    }

    .docs-content h1 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 2.25rem;
    }

    .docs-content h2 {
      margin-top: 3rem;
      margin-bottom: 1rem;
      font-size: 1.6rem;
    }

    .docs-content h3 {
      margin-top: 2rem;
      font-size: 1.25rem;
    }

    .docs-content p {
      margin: 1rem 0;
    }

    .docs-content a {
      color: var(--link);
    }

    .docs-content img {
      max-width: 100%;
      height: auto;
    }

    .docs-content code {
      padding: 0.15em 0.35em;

      background: #f1f1f1;
      border-radius: 0.25rem;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 0.9em;
    }

    .docs-content pre {
      overflow-x: auto;

      padding: 1rem;

      background: #f6f6f6;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }

    .docs-content pre code {
      padding: 0;
      background: none;
    }

    .docs-content blockquote {
      margin: 1.5rem 0;
      padding: 0.5rem 1rem;

      color: var(--muted);
      border-left: 4px solid var(--border);
    }

    .docs-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .docs-content th,
    .docs-content td {
      padding: 0.65rem;
      text-align: left;
      border: 1px solid var(--border);
    }

    .docs-content th {
      background: #f7f7f8;
    }

    @media (max-width: 800px) {
      .docs-layout {
        display: block;
      }

      .docs-sidebar {
        position: static;
        height: auto;

        border-right: 0;
        border-bottom: 1px solid var(--border);

        padding: 1rem;
      }

      .docs-sidebar-title {
        margin-bottom: 0.75rem;
      }

      .docs-navigation {
        max-height: 50vh;
        overflow-y: auto;
      }

      .docs-main {
        padding: 2rem 1rem 4rem;
      }

      .docs-content h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>

  <div class="docs-layout">

    <aside class="docs-sidebar">

      <a
        class="docs-sidebar-title"
        href="{{ "/" | relative_url }}"
      >
        {{ site.title }}
      </a>

      <nav
        class="docs-navigation"
        aria-label="Documentation"
      >

        {% assign sorted_docs = site.privacy_docs | sort: "order" %}

        {% for doc in sorted_docs %}

          <a
            href="{{ doc.url | relative_url }}"
            {% if page.url == doc.url %}
              class="active"
              aria-current="page"
            {% endif %}
          >
            {{ doc.title }}
          </a>

        {% endfor %}

      </nav>

    </aside>

    <main class="docs-main">

      <article class="docs-content">
        {{ content }}
      </article>

    </main>

  </div>

</body>
</html>
